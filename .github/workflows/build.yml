name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Appli Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
            # Les erreurs de compilation apparaissent en rouge sur la page du build.
            grep -E "^e: |error:|What went wrong|FAILED" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PhoneDeck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-Android
          path: PhoneDeck.apk

  windows:
    name: Appli Windows (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compiler l'exe
        run: dotnet publish pc/PhoneDeckPC/PhoneDeckPC.csproj -c Release -p:BuildNumber=${{ github.run_number }} -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Zipper
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath PhoneDeckPC-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDeck-Windows
          path: PhoneDeckPC-Windows.zip

  release:
    name: Publier la dernière version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Mettre à jour la release « derniere-version »
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete derniere-version --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create derniere-version PhoneDeck.apk PhoneDeckPC-Windows.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "KeyraDeck : dernière version" \
            --notes "build:${{ github.run_number }} — fabriquée automatiquement depuis le commit $GITHUB_SHA. PhoneDeck.apk = KeyraDeck pour Android, PhoneDeckPC-Windows.zip = KeyraDeck pour Windows (les noms de fichiers restent les mêmes pour que la mise à jour automatique continue de fonctionner)."
