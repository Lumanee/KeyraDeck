name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Numéro de version
    runs-on: ubuntu-latest
    outputs:
      display: ${{ steps.v.outputs.display }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "display=$(bash .github/version.sh)" >> "$GITHUB_OUTPUT"

  android:
    name: Appli Android (APK)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
            # Les erreurs de compilation apparaissent en rouge sur la page du build.
            grep -E "^e: |error:|What went wrong|FAILED" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
      - name: Renommer
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KeyraDeck.apk
          # Ancien nom, pour que les téléphones pas encore mis à jour trouvent toujours leur fichier.
          cp KeyraDeck.apk PhoneDeck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KeyraDeck-Android
          path: |
            KeyraDeck.apk
            PhoneDeck.apk

  windows:
    name: Appli Windows (exe)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compiler l'exe
        run: dotnet publish pc/PhoneDeckPC/PhoneDeckPC.csproj -c Release -p:BuildNumber=${{ github.run_number }} -p:DisplayVersion=${{ needs.version.outputs.display }} -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Zipper
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath KeyraDeck-Windows.zip
          # Ancien nom (zip contenant PhoneDeckPC.exe) pour les PC pas encore mis à jour : au lancement il devient KeyraDeck.exe.
          New-Item -ItemType Directory -Path legacy | Out-Null
          Copy-Item publish/KeyraDeck.exe legacy/PhoneDeckPC.exe
          Compress-Archive -Path legacy/* -DestinationPath PhoneDeckPC-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KeyraDeck-Windows
          path: |
            KeyraDeck-Windows.zip
            PhoneDeckPC-Windows.zip

  release:
    name: Publier la dernière version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Mettre à jour la release « derniere-version »
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.display }}
        run: |
          gh release delete derniere-version --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create derniere-version KeyraDeck.apk KeyraDeck-Windows.zip PhoneDeck.apk PhoneDeckPC-Windows.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "KeyraDeck $VERSION (dernière version)" \
            --notes "version:$VERSION build:${{ github.run_number }} — fabriquée automatiquement depuis le commit $GITHUB_SHA. KeyraDeck.apk = appli Android, KeyraDeck-Windows.zip = appli Windows (PhoneDeck.apk et PhoneDeckPC-Windows.zip sont les mêmes fichiers sous l'ancien nom, gardés pour la mise à jour automatique des anciennes installations)."
